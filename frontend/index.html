<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Routemate matches fixed-schedule commuters with drivers already making the same trip." />
    <title>Routemate</title>
    <script>
      // Set light/dark before first paint: saved choice, else the device setting. See src/lib/theme.ts.
      try {
        var t = localStorage.getItem('routemate-theme')
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
